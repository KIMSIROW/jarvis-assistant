<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S.</title>
<style>
  :root { --bg:#050b14; --panel:#0b1a2b; --line:#12466b; --cyan:#37d5ff; --text:#cfefff; --dim:#6f95ad; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: radial-gradient(circle at 50% 0%, #0a2038 0%, var(--bg) 60%); color: var(--text);
         font-family: "Segoe UI", "Malgun Gothic", sans-serif; display: flex; flex-direction: column; align-items: center; }
  header { text-align: center; padding: 22px 12px 8px; }
  .reactor { width: 64px; height: 64px; margin: 0 auto 8px; border-radius: 50%;
             border: 3px solid var(--cyan); box-shadow: 0 0 18px var(--cyan), inset 0 0 14px var(--cyan);
             position: relative; animation: pulse 2.4s ease-in-out infinite; }
  .reactor::after { content:""; position:absolute; inset: 18px; border-radius:50%; background: var(--cyan); opacity:.85; box-shadow: 0 0 16px var(--cyan); }
  .reactor.listening { animation-duration: .6s; border-color:#ff5d7a; box-shadow: 0 0 22px #ff5d7a, inset 0 0 14px #ff5d7a; }
  .reactor.listening::after { background:#ff5d7a; box-shadow:0 0 16px #ff5d7a; }
  @keyframes pulse { 50% { transform: scale(1.07); filter: brightness(1.3); } }
  h1 { margin: 0; font-size: 20px; letter-spacing: 6px; font-weight: 600; color: var(--cyan); }
  .sub { color: var(--dim); font-size: 12px; margin-top: 4px; }
  main { width: min(760px, 100%); flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 8px 12px 14px; }
  #log { flex: 1; overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .msg { max-width: 82%; margin: 8px 0; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; line-height: 1.5; font-size: 15px; }
  .me { margin-left: auto; background: #0f3a5a; border: 1px solid #1c6a9c; }
  .bot { background: #081523; border: 1px solid var(--line); box-shadow: 0 0 10px rgba(55,213,255,.08); }
  .bot::before { content: "JARVIS"; display:block; font-size: 10px; letter-spacing: 3px; color: var(--cyan); margin-bottom: 3px; }
  .chips { display:flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 8px; }
  .chip { background: transparent; color: var(--cyan); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 12px; cursor: pointer; }
  .chip:hover { background: #0d2a42; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; background: var(--panel); border: 1px solid var(--line); color: var(--text); padding: 12px 14px; border-radius: 10px; font-size: 15px; outline: none; }
  input[type=text]:focus { border-color: var(--cyan); box-shadow: 0 0 8px rgba(55,213,255,.4); }
  button.btn { background: #0d2a42; color: var(--cyan); border: 1px solid var(--line); border-radius: 10px; padding: 0 16px; font-size: 15px; cursor: pointer; }
  button.btn:hover { background: #12466b; }
  #timerbar { display:none; margin-top: 8px; font-size: 13px; color: var(--cyan); text-align:center; }
  .tools { display:flex; justify-content: space-between; align-items:center; font-size: 12px; color: var(--dim); margin-top: 8px; }
  .tools label { cursor: pointer; }
  .est { text-align:center; color: var(--dim); font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <div class="reactor" id="reactor"></div>
  <h1>J.A.R.V.I.S.</h1>
  <div class="sub">Just A Rather Very Intelligent System · API 키 없는 개인 비서</div>
</header>
<main>
  <div id="log" aria-live="polite"></div>
  <div class="chips" id="chips"></div>
  <div id="timerbar"></div>
  <form id="form">
    <input type="text" id="input" placeholder="명령을 입력하거나 🎤를 눌러 말씀하세요" autocomplete="off" autofocus>
    <button type="button" class="btn" id="mic" title="음성 입력">🎤</button>
    <button type="submit" class="btn">전송</button>
  </form>
  <div class="tools">
    <label><input type="checkbox" id="tts" checked> 음성으로 답변 듣기</label>
    <span id="status"></span>
  </div>
</main>
<script>
(function () {
  const log = document.getElementById("log");
  const input = document.getElementById("input");
  const form = document.getElementById("form");
  const chipsEl = document.getElementById("chips");
  const reactor = document.getElementById("reactor");
  const ttsBox = document.getElementById("tts");
  const micBtn = document.getElementById("mic");
  const timerbar = document.getElementById("timerbar");
  const statusEl = document.getElementById("status");

  // 사용자별 데이터 구분용 익명 ID (브라우저에만 저장, 서버 키 아님)
  let uid = "guest";
  try {
    uid = localStorage.getItem("jarvis_uid");
    if (!uid) { uid = "u" + Math.random().toString(36).slice(2, 12); localStorage.setItem("jarvis_uid", uid); }
  } catch (e) { uid = "guest"; }

  function add(text, who) {
    const d = document.createElement("div");
    d.className = "msg " + who;
    d.textContent = text;
    log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  function speak(text) {
    if (!ttsBox.checked || !("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/\n/g, ". "));
    u.lang = "ko-KR";
    window.speechSynthesis.speak(u);
  }

  let timerHandle = null;
  function startTimer(seconds) {
    clearInterval(timerHandle);
    const end = Date.now() + seconds * 1000;
    timerbar.style.display = "block";
    timerHandle = setInterval(() => {
      const left = Math.max(0, Math.round((end - Date.now()) / 1000));
      const m = String(Math.floor(left / 60)).padStart(2, "0");
      const s = String(left % 60).padStart(2, "0");
      timerbar.textContent = "⏱ 남은 시간 " + (left >= 3600 ? Math.floor(left / 3600) + ":" : "") + m + ":" + s;
      if (left <= 0) {
        clearInterval(timerHandle);
        timerbar.style.display = "none";
        const msg = "타이머가 종료되었습니다.";
        add(msg, "bot"); speak(msg);
      }
    }, 500);
  }

  async function send(text) {
    text = text.trim();
    if (!text) return;
    add(text, "me");
    input.value = "";
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, user_id: uid })
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      add(data.reply, "bot");
      speak(data.reply);
      if (data.action && data.action.type === "timer") startTimer(data.action.seconds);
    } catch (e) {
      add("서버와 통신하지 못했습니다. 잠시 후 다시 시도해 주세요. (" + e.message + ")", "bot");
    }
  }

  form.addEventListener("submit", (e) => { e.preventDefault(); send(input.value); });

  ["도움말", "지금 몇 시야?", "오늘 날짜", "할 일 목록", "타이머 1분", "계산 3*(4+2)", "농담 해줘"].forEach((t) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = t;
    b.onclick = () => send(t);
    chipsEl.appendChild(b);
  });

  // 음성 입력 (Web Speech API - 키 불필요, 크롬 계열 권장)
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    micBtn.disabled = true;
    micBtn.title = "이 브라우저는 음성 입력을 지원하지 않습니다 (크롬 권장)";
    statusEl.textContent = "음성 입력 미지원 브라우저";
  } else {
    const rec = new SR();
    rec.lang = "ko-KR"; rec.interimResults = false; rec.maxAlternatives = 1;
    rec.onstart = () => reactor.classList.add("listening");
    rec.onend = () => reactor.classList.remove("listening");
    rec.onerror = (e) => { statusEl.textContent = "음성 인식 오류: " + e.error; };
    rec.onresult = (e) => { send(e.results[0][0].transcript); };
    micBtn.onclick = () => { statusEl.textContent = ""; try { rec.start(); } catch (e) {} };
  }

  add("안녕하십니까, 사장님. 자비스입니다. '도움말'이라고 말씀해 보세요.[자동배포 테스트][HW3 Docker 배포]", "bot");
})();
</script>
</body>
</html>
